[project]
name = "infracop-mcp"
version = "1.0.0"
description = "Private enterprise DevOps standards MCP server (LangChain + Qdrant)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.9.0",
  "mangum>=0.19.0",
  "starlette>=0.41.0",
  "qdrant-client>=1.12.0",
  "langchain-core>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-aws>=0.2.0",
  "langchain-qdrant>=0.2.0",
  "boto3>=1.35.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
infracop-mcp = "infracop_mcp.server:main"
infracop-ingest = "infracop_mcp.ingest:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
